name: Build Kernel 6.1 with KernelSU-Next & Susfs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      # =============== 1. Install KernelSU-Next (official method) ===============
      - name: Install KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          echo "KernelSU-Next installed successfully"

      # =============== 2. Setup Susfs (with fallback and fuzz) ===============
      - name: Clone susfs4ksu repository (try dev branch first)
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1-dev --depth=1 susfs || \
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth=1 susfs

      - name: Copy Susfs kernel files
        run: |
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs/kernel_patches/include/linux/susfs_def.h include/linux/

      - name: Apply main Susfs patch to kernel (with fuzz)
        run: |
          if patch -p1 --fuzz=3 --no-backup-if-mismatch --batch < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch; then
            echo "Main Susfs patch applied with -p1"
          else
            echo "Patch -p1 failed, trying -p0..."
            if patch -p0 --fuzz=3 --no-backup-if-mismatch --batch < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch; then
              echo "Main Susfs patch applied with -p0"
            else
              echo "WARNING: Main Susfs patch partially failed. Build will continue, but Susfs may not work."
            fi
          fi

      - name: Apply Susfs integration patch to KernelSU-Next (with fuzz)
        run: |
          cd KernelSU-Next
          if patch -p1 --fuzz=3 --no-backup-if-mismatch --batch < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; then
            echo "Integration patch applied with -p1"
          else
            echo "Patch -p1 failed, trying -p0..."
            if patch -p0 --fuzz=3 --no-backup-if-mismatch --batch < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; then
              echo "Integration patch applied with -p0"
            else
              echo "WARNING: Integration patch failed. Susfs may not fully work."
            fi
          fi
          cd ..

      # =============== 3. Apply other patches (ABI bypass, sysvipc) ===============
      - name: Download and apply other patches
        run: |
          curl -L -o abi_bypass.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/wild/bypass_patches/abi_bypass_gki.patch
          curl -L -o sysvipc_fix.patch https://raw.githubusercontent.com/Antaru74/GKI-6.1/master/kernel-patches/common/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          for patch_file in abi_bypass.patch sysvipc_fix.patch; do
            for level in 1 0; do
              if patch -p$level -N --dry-run --batch --no-backup-if-mismatch < $patch_file 2>/dev/null; then
                patch -p$level -N --batch --no-backup-if-mismatch < $patch_file
                echo "$patch_file applied with -p$level"
                break
              fi
            done
          done

      # =============== 4. Install build dependencies ===============
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full \
            android-sdk-libsparse-utils erofs-utils default-jdk gnupg \
            flex bison gperf build-essential zip curl libc6-dev libncurses-dev \
            libx11-dev libreadline-dev libgl1-mesa-dev sudo bc \
            grep tofrodos python3-markdown libxml2-utils xsltproc libtinfo6 \
            cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools \
            zstd rsync
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && \
            sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb || true

      # =============== 5. Setup Neutron Clang ===============
      - name: Setup Neutron Clang
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          curl -L -o neutron-clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/03062026/neutron-clang-03062026.tar.zst
          tar -I zstd -xf neutron-clang.tar.zst
          rm neutron-clang.tar.zst
          CLANG_DIR=$(ls -d neutron-clang-* | head -n1)
          echo "PATH=$HOME/toolchains/$CLANG_DIR/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$HOME/toolchains/$CLANG_DIR/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # =============== 6. Environment variables ===============
      - name: Set environment variables
        run: |
          echo "KERNEL_ROOT=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=@ravindu644" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${HOME}/toolchains/neutron-clang-*/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      # =============== 7. Build kernel ===============
      - name: Build kernel
        id: build
        run: |
          export KERNEL_ROOT="${GITHUB_WORKSPACE}"
          export CLANG_DIR="${HOME}/toolchains/$(ls -d ${HOME}/toolchains/neutron-clang-* | head -n1)"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export CC="${CLANG_DIR}/bin/clang"

          BUILD_OPTIONS=(
            -C "${KERNEL_ROOT}"
            O="${KERNEL_ROOT}/out"
            -j"$(nproc)"
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            CC="${CC}"
            LLVM=1
            LLVM_IAS=1
            AR="$(dirname ${CC})/llvm-ar"
            NM="$(dirname ${CC})/llvm-nm"
            LD="$(dirname ${CC})/ld.lld"
            STRIP="$(dirname ${CC})/llvm-strip"
            OBJCOPY="$(dirname ${CC})/llvm-objcopy"
            OBJDUMP="$(dirname ${CC})/llvm-objdump"
            READELF="$(dirname ${CC})/llvm-readelf"
            HOSTCC="${CC}"
            HOSTCXX="${CC}++"
          )

          mkdir -p "${KERNEL_ROOT}/out"

          # Gunakan defconfig khusus (pastikan CONFIG_KSU=y dan CONFIG_KSU_SUSFS=y sudah ada)
          make "${BUILD_OPTIONS[@]}" spearhead2ksu_defconfig
          make "${BUILD_OPTIONS[@]}" olddefconfig
          make "${BUILD_OPTIONS[@]}" Image

          if [ -f "${KERNEL_ROOT}/out/arch/arm64/boot/Image" ]; then
            echo "exit_code=0" >> $GITHUB_OUTPUT
          else
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi

      # =============== 8. Collect artifacts ===============
      - name: Collect artifacts
        if: steps.build.outputs.exit_code == 0
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ || true
          cp out/arch/arm64/boot/Image.lz4 artifacts/ || true

      - name: Upload artifacts
        if: steps.build.outputs.exit_code == 0
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-spearhead-ksu-next-susfs
          path: artifacts
