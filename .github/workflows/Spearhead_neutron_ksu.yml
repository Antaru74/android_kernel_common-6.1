name: Build Kernel 6.1 Neutron

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (depth=1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      # Cache untuk apt packages
      - name: Cache apt packages
        uses: actions/cache@v4
        id: cache-apt
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-${{ hashFiles('**/apt-packages.txt') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full \
            android-sdk-libsparse-utils erofs-utils default-jdk gnupg \
            flex bison gperf build-essential zip curl libc6-dev libncurses-dev \
            libx11-dev libreadline-dev libgl1-mesa-dev sudo bc \
            grep tofrodos python3-markdown libxml2-utils xsltproc libtinfo6 \
            cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools \
            zstd rsync
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && \
            sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb || true

      # Cache untuk toolchain dengan compression
      - name: Cache Neutron Clang toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchains/neutron-clang-*
            ~/.cache/ccache
          key: neutron-clang-03062026-${{ runner.os }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            neutron-clang-03062026-${{ runner.os }}
            neutron-clang-${{ runner.os }}

      - name: Download and apply kernel patches (skip if fails)
        run: |
          echo "Downloading patches..."
          curl -L -o abi_bypass.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/wild/bypass_patches/abi_bypass_gki.patch
          curl -L -o sysvipc_fix.patch https://raw.githubusercontent.com/Antaru74/GKI-6.1/master/kernel-patches/common/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          # Function to apply patch safely
          apply_patch() {
            local patch_file=$1
            local patch_level=$2
            echo "Trying to apply $patch_file with -p$patch_level..."
            if patch -p$patch_level -N --dry-run < $patch_file > /dev/null 2>&1; then
              patch -p$patch_level -N < $patch_file
              echo "✓ $patch_file applied successfully with -p$patch_level"
              return 0
            else
              echo "✗ $patch_file cannot be applied with -p$patch_level"
              return 1
            fi
          }

          # Try abi_bypass.patch with -p1 (standard)
          if ! apply_patch abi_bypass.patch 1; then
            # Try with -p0 just in case
            if ! apply_patch abi_bypass.patch 0; then
              echo "WARNING: abi_bypass.patch cannot be applied. Skipping..."
            fi
          fi

          # Try sysvipc_fix.patch with -p1
          if ! apply_patch sysvipc_fix.patch 1; then
            if ! apply_patch sysvipc_fix.patch 0; then
              echo "WARNING: sysvipc_fix.patch cannot be applied. Skipping..."
            fi
          fi

          echo "Patch processing completed."

      - name: Setup Neutron Clang toolchain with ccache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          curl -L -o neutron-clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/03062026/neutron-clang-03062026.tar.zst
          tar -I zstd -xf neutron-clang.tar.zst
          rm neutron-clang.tar.zst
          
          # Setup ccache
          sudo apt install -y ccache
          ccache -M 5G
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          
          CLANG_DIR=$(ls -d neutron-clang-* | head -n1)
          echo "PATH=$HOME/toolchains/$CLANG_DIR/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$HOME/toolchains/$CLANG_DIR/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Setup ccache for cached toolchain
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          sudo apt install -y ccache
          ccache -M 5G
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          
          CLANG_DIR=$(ls -d $HOME/toolchains/neutron-clang-* | head -n1)
          echo "PATH=$CLANG_DIR/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$CLANG_DIR/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Set environment variables
        run: |
          echo "KERNEL_ROOT=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=@ravindu644" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime" >> $GITHUB_ENV

      # Cache untuk kernel build outputs dengan ccache
      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            out/
            build/
            ~/.cache/ccache
          key: kernel-build-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            kernel-build-${{ github.sha }}-
            kernel-build-

      - name: Build kernel with optimizations
        id: build
        run: |
          export KERNEL_ROOT="${GITHUB_WORKSPACE}"
          export CLANG_DIR="$(ls -d ${HOME}/toolchains/neutron-clang-* | head -n1)"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export CC="${CLANG_DIR}/bin/clang"
          
          # Gunakan ccache
          export CC="ccache ${CLANG_DIR}/bin/clang"
          export CXX="ccache ${CLANG_DIR}/bin/clang++"
          
          # Optimasi build flags
          export KCFLAGS="-O2 -pipe -fomit-frame-pointer -march=armv8-a+crc+crypto+fp16+rcpc+dotprod+sha3+fp16fml+rdm+lse+fp16+sha2+fp16fml+fp16 -mtune=neoverse-n1"
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"

          BUILD_OPTIONS=(
            -C "${KERNEL_ROOT}"
            O="${KERNEL_ROOT}/out"
            -j"$(nproc)"
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            CC="${CC}"
            LLVM=1
            LLVM_IAS=1
            AR="$(dirname ${CLANG_DIR}/bin/clang)/llvm-ar"
            NM="$(dirname ${CLANG_DIR}/bin/clang)/llvm-nm"
            LD="$(dirname ${CLANG_DIR}/bin/clang)/ld.lld"
            STRIP="$(dirname ${CLANG_DIR}/bin/clang)/llvm-strip"
            OBJCOPY="$(dirname ${CLANG_DIR}/bin/clang)/llvm-objcopy"
            OBJDUMP="$(dirname ${CLANG_DIR}/bin/clang)/llvm-objdump"
            READELF="$(dirname ${CLANG_DIR}/bin/clang)/llvm-readelf"
            HOSTCC="${CLANG_DIR}/bin/clang"
            HOSTCXX="${CLANG_DIR}/bin/clang++"
            KCFLAGS="${KCFLAGS}"
            CFLAGS="${CFLAGS}"
            CXXFLAGS="${CXXFLAGS}"
          )

          mkdir -p "${KERNEL_ROOT}/out" "${KERNEL_ROOT}/build"

          # Optimasi: skip defconfig jika sudah ada
          if [ ! -f "${KERNEL_ROOT}/out/.config" ]; then
            echo "Running defconfig..."
            make "${BUILD_OPTIONS[@]}" spearhead2_defconfig
          else
            echo "Using existing .config file"
          fi

          # Build hanya kernel dan modules yang diperlukan
          echo "Building kernel image..."
          time make "${BUILD_OPTIONS[@]}" Image

          if [ -f "${KERNEL_ROOT}/out/arch/arm64/boot/Image" ]; then
            echo "exit_code=0" >> $GITHUB_OUTPUT
            echo "Build successful!"
          else
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Tampilkan statistik ccache
          ccache -s

      - name: Collect artifacts (kernel image only)
        if: steps.build.outputs.exit_code == 0
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ || true
          cp out/arch/arm64/boot/Image.lz4 artifacts/ || true
          
          # Tambahan: compress artifact untuk upload lebih cepat
          cd artifacts
          tar -czf kernel-image-spearhead.tar.gz Image Image.lz4 2>/dev/null || true

      - name: Upload artifacts
        if: steps.build.outputs.exit_code == 0
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-spearhead
          path: artifacts/*
          compression-level: 6
