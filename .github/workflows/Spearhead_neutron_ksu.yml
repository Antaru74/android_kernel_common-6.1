name: Build Kernel 6.1 Neutron with KernelSU & Susfs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (depth=1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      # =============== 1. Download & Apply KernelSU patch (for 6.1) ===============
      - name: Download KernelSU patch
        run: |
          curl -L -o kernelsu_6.1.patch https://raw.githubusercontent.com/tiann/KernelSU/main/kernel_patches/KernelSU-6.1.patch
          echo "KERNELSU_PATCH=$(pwd)/kernelsu_6.1.patch" >> $GITHUB_ENV

      - name: Apply KernelSU patch
        run: |
          if patch -p1 -N --dry-run < $KERNELSU_PATCH > /dev/null 2>&1; then
            patch -p1 -N < $KERNELSU_PATCH
            echo "✓ KernelSU patch applied"
          else
            echo "✗ KernelSU patch failed, trying -p0..."
            if patch -p0 -N --dry-run < $KERNELSU_PATCH > /dev/null 2>&1; then
              patch -p0 -N < $KERNELSU_PATCH
              echo "✓ KernelSU patch applied with -p0"
            else
              echo "KernelSU patch cannot be applied. Aborting."
              exit 1
            fi
          fi

      # =============== 2. Clone susfs4ksu & apply patches ===============
      - name: Clone susfs4ksu repository
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth=1 ksu
          echo "SUSFS_MAIN_PATCH=$(pwd)/ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" >> $GITHUB_ENV
          echo "SUSFS_INTEGRATION_PATCH=$(pwd)/ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" >> $GITHUB_ENV

      - name: Apply Susfs main patch
        run: |
          if patch -p1 -N --dry-run < $SUSFS_MAIN_PATCH > /dev/null 2>&1; then
            patch -p1 -N < $SUSFS_MAIN_PATCH
            echo "✓ Susfs main patch applied"
          else
            echo "✗ Susfs main patch failed, trying -p0..."
            if patch -p0 -N --dry-run < $SUSFS_MAIN_PATCH > /dev/null 2>&1; then
              patch -p0 -N < $SUSFS_MAIN_PATCH
              echo "✓ Susfs main patch applied with -p0"
            else
              echo "Susfs main patch cannot be applied. Aborting."
              exit 1
            fi
          fi

      - name: Apply Susfs-KernelSU integration patch
        run: |
          if patch -p1 -N --dry-run < $SUSFS_INTEGRATION_PATCH > /dev/null 2>&1; then
            patch -p1 -N < $SUSFS_INTEGRATION_PATCH
            echo "✓ Integration patch applied"
          else
            echo "✗ Integration patch failed, trying -p0..."
            if patch -p0 -N --dry-run < $SUSFS_INTEGRATION_PATCH > /dev/null 2>&1; then
              patch -p0 -N < $SUSFS_INTEGRATION_PATCH
              echo "✓ Integration patch applied with -p0"
            else
              echo "Integration patch cannot be applied. Aborting."
              exit 1
            fi
          fi

      # =============== 3. Other patches (ABI bypass, sysvipc fix) ===============
      - name: Download and apply kernel patches (skip if fails)
        run: |
          echo "Downloading patches..."
          curl -L -o abi_bypass.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/wild/bypass_patches/abi_bypass_gki.patch
          curl -L -o sysvipc_fix.patch https://raw.githubusercontent.com/Antaru74/GKI-6.1/master/kernel-patches/common/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          apply_patch() {
            local patch_file=$1
            local patch_level=$2
            echo "Trying to apply $patch_file with -p$patch_level..."
            if patch -p$patch_level -N --dry-run < $patch_file > /dev/null 2>&1; then
              patch -p$patch_level -N < $patch_file
              echo "✓ $patch_file applied successfully with -p$patch_level"
              return 0
            else
              echo "✗ $patch_file cannot be applied with -p$patch_level"
              return 1
            fi
          }

          if ! apply_patch abi_bypass.patch 1; then
            if ! apply_patch abi_bypass.patch 0; then
              echo "WARNING: abi_bypass.patch cannot be applied. Skipping..."
            fi
          fi

          if ! apply_patch sysvipc_fix.patch 1; then
            if ! apply_patch sysvipc_fix.patch 0; then
              echo "WARNING: sysvipc_fix.patch cannot be applied. Skipping..."
            fi
          fi

          echo "Patch processing completed."

      # =============== 4. Install dependencies ===============
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full \
            android-sdk-libsparse-utils erofs-utils default-jdk gnupg \
            flex bison gperf build-essential zip curl libc6-dev libncurses-dev \
            libx11-dev libreadline-dev libgl1-mesa-dev sudo bc \
            grep tofrodos python3-markdown libxml2-utils xsltproc libtinfo6 \
            cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools \
            zstd rsync
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && \
            sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb || true

      # =============== 5. Setup Neutron Clang ===============
      - name: Setup Neutron Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          curl -L -o neutron-clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/03062026/neutron-clang-03062026.tar.zst
          tar -I zstd -xf neutron-clang.tar.zst
          rm neutron-clang.tar.zst
          CLANG_DIR=$(ls -d neutron-clang-* | head -n1)
          echo "PATH=$HOME/toolchains/$CLANG_DIR/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$HOME/toolchains/$CLANG_DIR/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # =============== 6. Environment variables ===============
      - name: Set environment variables
        run: |
          echo "KERNEL_ROOT=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=@ravindu644" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${HOME}/toolchains/neutron-clang-*/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      # =============== 7. Build kernel with custom defconfig ===============
      - name: Build kernel
        id: build
        run: |
          export KERNEL_ROOT="${GITHUB_WORKSPACE}"
          export CLANG_DIR="${HOME}/toolchains/$(ls -d ${HOME}/toolchains/neutron-clang-* | head -n1)"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export CC="${CLANG_DIR}/bin/clang"

          BUILD_OPTIONS=(
            -C "${KERNEL_ROOT}"
            O="${KERNEL_ROOT}/out"
            -j"$(nproc)"
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            CC="${CC}"
            LLVM=1
            LLVM_IAS=1
            AR="$(dirname ${CC})/llvm-ar"
            NM="$(dirname ${CC})/llvm-nm"
            LD="$(dirname ${CC})/ld.lld"
            STRIP="$(dirname ${CC})/llvm-strip"
            OBJCOPY="$(dirname ${CC})/llvm-objcopy"
            OBJDUMP="$(dirname ${CC})/llvm-objdump"
            READELF="$(dirname ${CC})/llvm-readelf"
            HOSTCC="${CC}"
            HOSTCXX="${CC}++"
          )

          mkdir -p "${KERNEL_ROOT}/out" "${KERNEL_ROOT}/build"

          # Gunakan defconfig khusus KernelSU + Susfs (pastikan file ada)
          make "${BUILD_OPTIONS[@]}" spearhead2ksu_defconfig
          make "${BUILD_OPTIONS[@]}" Image

          if [ -f "${KERNEL_ROOT}/out/arch/arm64/boot/Image" ]; then
            echo "exit_code=0" >> $GITHUB_OUTPUT
          else
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi

      # =============== 8. Collect artifacts ===============
      - name: Collect artifacts (kernel image only)
        if: steps.build.outputs.exit_code == 0
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ || true
          cp out/arch/arm64/boot/Image.lz4 artifacts/ || true

      - name: Upload artifacts
        if: steps.build.outputs.exit_code == 0
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-spearhead-ksu-susfs
          path: artifacts
